# Bijoux Conseil - configuration Hugo
# Domaine prevu : bijoux-conseil.com (PAS ENCORE ACHETE au 2026-09-22).
# Tant qu'il n'est pas achete et connecte, le site vit sur GitHub Pages.
# Une fois le domaine achete : passer baseURL sur "https://bijoux-conseil.com/"
# et creer le fichier CNAME a la racine avec "bijoux-conseil.com".

baseURL = "https://analytics-ds.github.io/bijoux-conseil/"
title = "Bijoux Conseil"
theme = "bijoux-conseil"

defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
enableEmoji = false
buildFuture = true

[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    rel = "alternate"
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "LLMS"]

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = true
  [markup.goldmark.renderer]
    unsafe = true

[related]
  includeNewer = true
  threshold = 80
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80

[params]
  default_lang = "fr"
  default_og_image = "/images/og-default.svg"
  logo = "/favicon.svg"
  founding_year = "2026"
  expertise = ["Bijoux", "Piercings", "Boucles d'oreilles", "Colliers", "Bagues"]
  og_locale_alternate = "en_US"

[languages]
  [languages.fr]
    languageCode = "fr-FR"
    languageName = "Francais"
    weight = 1
    contentDir = "content/fr"
    title = "Bijoux Conseil"
    [languages.fr.params]
      description = "Le guide des bijoux et des piercings : comment choisir, comparer et porter boucles d'oreilles, piercings, bagues et colliers."

  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    weight = 2
    contentDir = "content/en"
    title = "Bijoux Conseil"
    [languages.en.params]
      description = "The jewellery and piercing guide: how to choose, compare and wear earrings, piercings, rings and necklaces."

[[languages.fr.menus.main]]
