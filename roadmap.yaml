# Roadmap editoriale evergreen — Bijoux Conseil (bijoux-conseil)
#
# Blog : https://analytics-ds.github.io/bijoux-conseil/ (bascule prevue sur https://bijoux-conseil.com/)
# Client relaye : Pohesia (pohesia.com)
# Langue principale : fr (content/fr) + EN (content/en)
# Cadence : 2 articles par semaine, mardi et vendredi, sur 6 mois
#   (52 articles, du 2026-10-02 au 2027-03-30)
#
# Categories disponibles (orthographe exacte, doit matcher le frontmatter du site) :
#   - Boucles d'oreilles
#   - Piercings
#   - Bagues
#   - Colliers
#   - Idees cadeaux
#
# FONCTIONNEMENT
# --------------
# L'agent prend la premiere entree avec status: todo et scheduled_date <= today,
# triee par scheduled_date croissante. Il genere l'article FR + EN et push sur
# main. GitHub Actions deploie. En cas d'echec, status passe a failed et error
# est rempli. Une entree failed n'est jamais retentee automatiquement.
#
# AJOUT D'UNE ENTREE
# ------------------
# Copier un bloc, remplir kw / category / scheduled_date, laisser les autres
# champs tels quels. volume et kd sont informatifs, ignores par l'agent.
#
# CHOIX DES MOTS-CLES (2026-09-29)
# --------------------------------
# Mots-cles informationnels uniquement, volumes Haloscan FR (septembre 2026).
# Exclus volontairement :
#   - les 10 sujets du seeding (taille de bague, longueur de collier, cicatrisation
#     piercing oreille, guide helix/conch/tragus, argent 925, plaque or, creoles...) ;
#   - les 74 mots-cles de la roadmap informationnelle du blog Pohesia (douleur,
#     signification, bienfaits et cicatrisation par emplacement, piercing infecte,
#     cheloide, allergie nickel, tendances), pour ne pas concurrencer le client ;
#   - les tetes helix, conch et tragus, deja couvertes par le guide du seeding.
# Saisonnalite : idee cadeau femme debut novembre (Noel), cadeau saint valentin
# fin decembre (indexation avant le 14 fevrier).

